# Registro diario de noches frías: guarda la mínima medida de anoche y el
# pronóstico de las 3 noches siguientes en data/noches-frias/AAAA-MM-DD.json.
# No usa secretos. Solo pide permiso de escritura para hacer el commit del día.
name: noches-frias

on:
  schedule:
    # 11:30 UTC = 06:30 en Bogotá (UTC-5, sin horario de verano).
    # GitHub puede retrasar el cron; la ventana de la noche ya cerró a las 06:00.
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noches-frias
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Traer el repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Registrar la noche
        id: registro
        # Código 1 = alguna fuente falló pero el archivo se escribió con lo que hubo.
        # Se guarda igual y el trabajo se marca como fallido al final.
        run: |
          set +e
          python3 pipelines/noches-frias/registrar.py
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" -ge 2 ]; then exit "$codigo"; fi
          exit 0

      - name: Commit del día
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noches-frias/
          if git diff --cached --quiet; then
            echo "Sin cambios: el archivo de hoy ya estaba."
            exit 0
          fi
          fecha=$(TZ=America/Bogota date +%F)
          git commit -m "chore(datos): noches frías $fecha"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((intento * 10))
          done
          echo "No se pudo hacer push después de 3 intentos."
          exit 1

      - name: Avisar si alguna fuente falló
        if: steps.registro.outputs.codigo == '1'
        run: |
          echo "::error::Alguna fuente falló hoy. Mira el campo «errores» del JSON del día."
          exit 1
